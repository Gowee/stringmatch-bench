[package]
name = "stringmatch_bench"
version = "0.1.0"
edition = "2021"

[dependencies]
aho-corasick = "=1.1.4"  # Unlicense or MIT
crawdad = "=0.4.0"  # MIT or Apache-2.0
daachorse = { git = "https://github.com/daac-tools/daachorse.git" }
daachorse_exp = { package = "daachorse", git = "https://github.com/Gowee/daachorse.git", branch = "linear-leftmost-longest-automaton" }
fst = "=0.4.7"  # Unlicense or MIT
hashbrown = "=0.17.1"  # MIT or Apache-2.0
yada = "=0.7.0"  # MIT or Apache-2.0

base64 = "0.22.1"  # MIT or Apache-2.0
clap = { version = "4.6.3", features = ["derive"] }  # MIT or Apache-2.0

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }  # Apache-2.0 or MIT

[[bench]]
name = "search"
harness = false

[[bench]]
name = "compare_leftmost"
harness = false

[[bin]]
name = "measure"
path = "src/measure.rs"

[[bin]]
name = "profile_compare"
path = "src/profile_compare.rs"
